name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days without activity, which is
# what took this tool offline in August 2026. Tutor registration is seasonal, so
# the quiet weeks between rounds are exactly when it would die. This job pokes
# the database often enough that it never goes idle.
#
# It also keeps ITSELF alive: GitHub disables scheduled workflows after about 60
# days of repository inactivity, so a keep-alive sitting in a repo nobody commits
# to would quietly stop working. The second step commits a timestamp, but only
# when the repo has actually been quiet for a while, so the log does not fill up
# with bot noise.
#
# If Supabase does not answer, this workflow FAILS, and GitHub emails the repo
# owner. That is the early warning that the tool is down.

on:
  schedule:
    # Mondays and Thursdays, 06:00 UTC. Never more than 4 days between pings,
    # comfortably inside the 7-day pause window even if Actions runs late.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the Supabase REST API
        run: |
          set -euo pipefail
          CFG=app/assets/config.js
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' "$CFG" | head -1)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+' "$CFG" | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Could not read SUPABASE_URL / SUPABASE_ANON_KEY from $CFG"
            exit 1
          fi
          echo "Pinging $URL"
          # Public availability data only. The anon key is already published in
          # config.js and row-level security keeps tutor details out of reach,
          # so no secrets and no personal data are involved here.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/course?select=code&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Supabase is not responding normally. The project may be paused."
            exit 1
          fi

      - name: Keep the schedule from being auto-disabled
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Last commit was $DAYS day(s) ago."
          if [ "$DAYS" -lt 25 ]; then
            echo "Repository is active, no keep-alive commit needed."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep-alive ping, prevent scheduled workflow expiry"
          git push
